<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 800" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Login with a one-time code</title>
  <desc>The messages exchanged when a user signs in with a code sent by email.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="888" height="800" fill="#ffffff"/>
  <g id="group-backend">
    <rect x="264" y="96" width="328" height="136" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="276" y="120.37" font-size="12" fill="#6b7280">Backend</text>
  </g>
  <g id="node-user">
    <line x1="72" y1="216" x2="72" y2="704" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="24" y="168" width="96" height="48" rx="24" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="72" y="197.09" text-anchor="middle" font-size="14" fill="#1f2937">User</text>
  </g>
  <g id="node-app">
    <line x1="200" y1="216" x2="200" y2="704" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="152" y="152" width="96" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="152" y1="168" x2="248" y2="168" stroke="#1f2937" stroke-width="1.5"/>
    <text x="200" y="197.09" text-anchor="middle" font-size="14" fill="#1f2937">Web app</text>
  </g>
  <g id="node-auth">
    <line x1="328" y1="216" x2="328" y2="704" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="280" y="136" width="96" height="80" rx="8" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text text-anchor="middle" font-size="14" fill="#ffffff"><tspan x="328" y="171.09">Auth</tspan><tspan x="328" y="191.09">service</tspan></text>
  </g>
  <g id="node-db">
    <line x1="520" y1="216" x2="520" y2="704" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M464 160 A56 8 0 0 1 576 160 L576 208 A56 8 0 0 1 464 208 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M464 160 A56 8 0 0 0 576 160" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="520" y="195.09" text-anchor="middle" font-size="14" fill="#1f2937">Users DB</text>
  </g>
  <g id="node-mail">
    <line x1="656" y1="216" x2="656" y2="704" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="608" y="136" width="96" height="80" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="656" y="171.09">Mail</tspan><tspan x="656" y="191.09">provider</tspan></text>
  </g>
  <g id="edge-user--app">
    <path d="M72 256 L200 256" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="136" y="248.11" text-anchor="middle" font-size="12" fill="#1f2937">enter email</text>
  </g>
  <g id="edge-app--auth">
    <path d="M200 296 L328 296" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="264" y="288.11" text-anchor="middle" font-size="12" fill="#1f2937">POST /login</text>
  </g>
  <g id="edge-auth--db">
    <path d="M328 336 L520 336" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="424" y="328.11" text-anchor="middle" font-size="12" fill="#1f2937">find user</text>
  </g>
  <g id="edge-found">
    <path d="M520 376 L328 376" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="424" y="368.11" text-anchor="middle" font-size="12" fill="#1f2937">user row</text>
  </g>
  <g id="edge-make-code">
    <path d="M328 416 L360 416 L360 432 L328 432" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="404.5" y="428.37" text-anchor="middle" font-size="12" fill="#1f2937">create code</text>
  </g>
  <g id="edge-auth--mail">
    <path d="M328 472 L656 472" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="424" y="464.11" text-anchor="middle" font-size="12" fill="#1f2937">send code</text>
  </g>
  <g id="edge-accepted">
    <path d="M328 512 L200 512" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="264" y="504.11" text-anchor="middle" font-size="12" fill="#1f2937">202 Accepted</text>
  </g>
  <g id="edge-prompt">
    <path d="M200 552 L72 552" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="136" y="544.11" text-anchor="middle" font-size="12" fill="#1f2937">ask for the code</text>
  </g>
  <g id="edge-code-in">
    <path d="M72 592 L200 592" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="136" y="584.11" text-anchor="middle" font-size="12" fill="#1f2937">enter code</text>
  </g>
  <g id="edge-verify">
    <path d="M200 632 L328 632" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="264" y="624.11" text-anchor="middle" font-size="12" fill="#1f2937">POST /verify</text>
  </g>
  <g id="edge-session">
    <path d="M328 672 L200 672" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="264" y="664.11" text-anchor="middle" font-size="12" fill="#1f2937">session cookie</text>
  </g>
  <g id="note-1">
    <line x1="736" y1="424" x2="445.01" y2="424" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="736" y="400" width="128" height="48" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="800" y="420.37">Six digits, valid</tspan><tspan x="800" y="436.37">for ten minutes</tspan></text>
  </g>
  <g id="note-2">
    <line x1="656" y1="728" x2="656" y2="704" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="608" y="728" width="96" height="48" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="656" y="748.37">Third-party</tspan><tspan x="656" y="764.37">service</tspan></text>
  </g>
  <g id="note-3">
    <line x1="432" y1="72" x2="432" y2="96" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="368" y="24" width="128" height="48" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="432" y="44.37">Runs in the</tspan><tspan x="432" y="60.37">private network</tspan></text>
  </g>
</svg>
