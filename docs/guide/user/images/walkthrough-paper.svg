<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 440" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Order placement</title>
  <desc>How an order moves from the storefront to fulfilment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#5a4e41"/></marker>
  </defs>
  <rect x="0" y="0" width="944" height="440" fill="#fbf7ef"/>
  <g id="group-backend" data-step="3">
    <rect x="280" y="24" width="640" height="208" rx="12" fill="none" stroke="#6f6457" stroke-width="1"/>
    <text x="292" y="48.37" font-size="12" fill="#6f6457">Backend</text>
    <circle cx="920" cy="24" r="9" fill="#a84a24" data-badge="3"/>
    <text x="920" y="28.37" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
  </g>
  <a href="https://example.com/storefront">
  <g id="node-web" data-step="1">
    <rect x="24" y="104" width="112" height="64" rx="12" fill="#f1e6d3" stroke="#6b5d4d" stroke-width="1.5"/>
    <line x1="24" y1="120" x2="136" y2="120" stroke="#6b5d4d" stroke-width="1.5"/>
    <text x="80" y="149.09" text-anchor="middle" font-size="14" fill="#3b342c">Storefront</text>
    <circle cx="24" cy="104" r="9" fill="#a84a24" data-badge="1"/>
    <text x="24" y="108.37" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
  </g>
  </a>
  <g id="node-api" data-step="2">
    <title>Owns the order lifecycle.</title>
    <rect x="304" y="112" width="112" height="48" rx="12" fill="#a84a24" stroke="#6b5d4d" stroke-width="1.5"/>
    <text x="360" y="141.09" text-anchor="middle" font-size="14" fill="#ffffff">Order API</text>
    <circle cx="304" cy="112" r="9" fill="#a84a24" data-badge="2"/>
    <text x="304" y="116.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
  </g>
  <g id="node-db" data-step="2">
    <path d="M792 160 A56 8 0 0 1 904 160 L904 208 A56 8 0 0 1 792 208 Z" fill="#f1e6d3" stroke="#6b5d4d" stroke-width="1.5"/>
    <path d="M792 160 A56 8 0 0 0 904 160" fill="none" stroke="#6b5d4d" stroke-width="1.5"/>
    <text x="848" y="195.09" text-anchor="middle" font-size="14" fill="#3b342c">Orders DB</text>
    <circle cx="792" cy="152" r="9" fill="#a84a24" data-badge="2"/>
    <text x="792" y="156.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
  </g>
  <g id="node-queue" data-step="3">
    <path d="M528 64 L688 64 A8 24 0 0 1 688 112 L528 112 A8 24 0 0 1 528 64 Z" fill="#f1e6d3" stroke="#6b5d4d" stroke-width="1.5"/>
    <path d="M688 64 A8 24 0 0 0 688 112" fill="none" stroke="#6b5d4d" stroke-width="1.5"/>
    <text x="608" y="93.09" text-anchor="middle" font-size="14" fill="#3b342c">Fulfilment queue</text>
    <circle cx="527.2" cy="71.2" r="9" fill="#a84a24" data-badge="3"/>
    <text x="527.2" y="75.57" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
  </g>
  <g id="node-check">
    <polygon points="608,152 680,184 608,216 536,184" fill="#f1e6d3" stroke="#6b5d4d" stroke-width="1.5"/>
    <text x="608" y="189.09" text-anchor="middle" font-size="14" fill="#3b342c">In stock?</text>
  </g>
  <g id="edge-web--api" data-step="1">
    <path d="M136 136 L304 136" fill="none" stroke="#5a4e41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="175.62" cy="122" r="9" fill="#a84a24" data-badge="1"/>
    <text x="175.62" y="126.37" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
    <text x="232" y="126.37" text-anchor="middle" font-size="12" fill="#3b342c">POST /orders</text>
  </g>
  <g id="edge-api--check" data-step="2">
    <path d="M416 144 L480 144 L480 184 L536 184" fill="none" stroke="#5a4e41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="448" cy="158" r="9" fill="#a84a24" data-badge="2"/>
    <text x="448" y="162.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
  </g>
  <g id="edge-check--db" data-step="2">
    <path d="M680 184 L792 184" fill="none" stroke="#5a4e41" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="715.74" cy="170" r="9" fill="#a84a24" data-badge="2"/>
    <text x="715.74" y="174.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
    <text x="748" y="174.37" text-anchor="middle" font-size="12" fill="#3b342c">insert</text>
  </g>
  <g id="edge-api--queue" data-step="3">
    <path d="M416 128 L472 128 L472 88 L520 88" fill="none" stroke="#5a4e41" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <circle cx="406.68" cy="98" r="9" fill="#a84a24" data-badge="3"/>
    <text x="406.68" y="102.37" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
    <text x="443.84" y="102.37" text-anchor="middle" font-size="12" fill="#3b342c">publish</text>
  </g>
  <g id="legend">
    <line x1="24" y1="274" x2="52" y2="274" stroke="#5a4e41" stroke-width="1.5"/>
    <text x="60" y="278.37" font-size="12" fill="#3b342c">call</text>
    <line x1="112" y1="274" x2="140" y2="274" stroke="#5a4e41" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="148" y="278.37" font-size="12" fill="#3b342c">asynchronous message</text>
    <rect x="322" y="268" width="24" height="12" rx="2" fill="#a84a24" stroke="#6b5d4d" stroke-width="1.5"/>
    <text x="356" y="278.37" font-size="12" fill="#3b342c">highlighted</text>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="305" r="9" fill="#a84a24" data-badge="1"/>
      <text x="33" y="309.37" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
      <text x="52" y="309.37" font-size="12" fill="#3b342c">The storefront sends the order to the API.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="331" r="9" fill="#a84a24" data-badge="2"/>
      <text x="33" y="335.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
      <text x="52" y="335.37" font-size="12" fill="#3b342c">The API checks stock, then stores the order in the database.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="357" r="9" fill="#a84a24" data-badge="3"/>
      <text x="33" y="361.37" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
      <text x="52" y="361.37" font-size="12" fill="#3b342c">The order is published for fulfilment; delivery is at least once so consumers must be idempotent.</text>
    </g>
    <g id="step-4">
      <circle cx="33" cy="383" r="9" fill="#a84a24" data-badge="4"/>
      <text x="33" y="387.37" text-anchor="middle" font-size="12" fill="#ffffff">4</text>
      <text x="52" y="387.37" font-size="12" fill="#3b342c">A step with nothing to point at still gets a line.</text>
    </g>
  </g>
  <g id="caption">
    <text x="24" y="416.37" font-size="12" fill="#6f6457">Figure 1. The order path. Payment is taken before the order is stored, so a failed charge leaves no record behind.</text>
  </g>
</svg>
