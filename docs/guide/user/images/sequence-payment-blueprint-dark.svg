<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 712" data-svgdog="1" font-family="JetBrains Mono, monospace">
  <title>Card payment</title>
  <desc>A shop asks its payment service to charge a card, which checks with the card network and the fraud screen.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#cfe0fa"/></marker>
  </defs>
  <rect x="0" y="0" width="952" height="712" fill="#0f2f5c"/>
  <g id="group-platform">
    <rect x="152" y="24" width="504" height="136" fill="none" stroke="#a9c0e4" stroke-width="1"/>
    <text x="164" y="48.32" font-size="12" fill="#a9c0e4">Our platform</text>
  </g>
  <g id="node-shopper">
    <line x1="80" y1="144" x2="80" y2="552" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="24" y="96" width="112" height="48" rx="24" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <text x="80" y="124.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Shopper</text>
  </g>
  <g id="node-shop">
    <line x1="224" y1="144" x2="224" y2="552" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="168" y="80" width="112" height="64" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <line x1="168" y1="96" x2="280" y2="96" stroke="#cfe0fa" stroke-width="1"/>
    <text x="224" y="124.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Web shop</text>
  </g>
  <g id="node-pay">
    <line x1="376" y1="144" x2="376" y2="552" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="328" y="64" width="96" height="80" fill="#e8f1ff" stroke="#cfe0fa" stroke-width="1"/>
    <text text-anchor="middle" font-size="13" fill="#0f2f5c"><tspan x="376" y="99.18">Payment</tspan><tspan x="376" y="118.18">service</tspan></text>
  </g>
  <g id="node-fraud">
    <line x1="592" y1="144" x2="592" y2="552" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="544" y="64" width="96" height="80" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <text text-anchor="middle" font-size="13" fill="#e8f1ff"><tspan x="592" y="99.18">Fraud</tspan><tspan x="592" y="118.18">screen</tspan></text>
  </g>
  <g id="node-network">
    <line x1="720" y1="144" x2="720" y2="552" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="672" y="64" width="96" height="80" fill="#153d75" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4"/>
    <text text-anchor="middle" font-size="13" fill="#e8f1ff"><tspan x="720" y="99.18">Card</tspan><tspan x="720" y="118.18">network</tspan></text>
  </g>
  <g id="edge-submit">
    <path d="M80 184 L224 184" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="152" y="175.4" text-anchor="middle" font-size="12" fill="#e8f1ff">pay now</text>
  </g>
  <g id="edge-charge">
    <path d="M224 224 L376 224" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="300" y="215.4" text-anchor="middle" font-size="12" fill="#e8f1ff">charge 49.00 EUR</text>
  </g>
  <g id="edge-score">
    <path d="M376 264 L592 264" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="484" y="255.4" text-anchor="middle" font-size="12" fill="#e8f1ff">score</text>
  </g>
  <g id="edge-low">
    <path d="M592 304 L376 304" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="484" y="295.4" text-anchor="middle" font-size="12" fill="#e8f1ff">low risk</text>
  </g>
  <g id="edge-auth">
    <path d="M376 344 L720 344" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="484" y="335.4" text-anchor="middle" font-size="12" fill="#e8f1ff">authorise</text>
  </g>
  <g id="edge-approved">
    <path d="M720 384 L376 384" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="656" y="375.4" text-anchor="middle" font-size="12" fill="#e8f1ff">approved</text>
  </g>
  <g id="edge-record">
    <path d="M376 424 L408 424 L408 440 L376 440" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="470.43" y="436.32" text-anchor="middle" font-size="12" fill="#e8f1ff">record payment</text>
  </g>
  <g id="edge-paid">
    <path d="M376 480 L224 480" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="300" y="471.4" text-anchor="middle" font-size="12" fill="#e8f1ff">paid</text>
  </g>
  <g id="edge-thanks">
    <path d="M224 520 L80 520" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="152" y="511.4" text-anchor="middle" font-size="12" fill="#e8f1ff">receipt</text>
  </g>
  <g id="note-1">
    <line x1="800" y1="432" x2="528.86" y2="432" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="800" y="400" width="128" height="64" fill="#0f2f5c" stroke="#a9c0e4" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#e8f1ff"><tspan x="864" y="420.32">Idempotent on</tspan><tspan x="864" y="436.32">the order</tspan><tspan x="864" y="452.32">number</tspan></text>
  </g>
  <g id="note-2">
    <line x1="720" y1="576" x2="720" y2="552" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="664" y="576" width="112" height="64" fill="#0f2f5c" stroke="#a9c0e4" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#e8f1ff"><tspan x="720" y="596.32">Answers</tspan><tspan x="720" y="612.32">within two</tspan><tspan x="720" y="628.32">seconds</tspan></text>
  </g>
  <g id="legend">
    <line x1="24" y1="682" x2="52" y2="682" stroke="#cfe0fa" stroke-width="1"/>
    <text x="60" y="686.32" font-size="12" fill="#e8f1ff">call</text>
    <line x1="120" y1="682" x2="148" y2="682" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="156" y="686.32" font-size="12" fill="#e8f1ff">asynchronous message</text>
    <rect x="338" y="676" width="24" height="12" rx="2" fill="#e8f1ff" stroke="#cfe0fa" stroke-width="1"/>
    <text x="372" y="686.32" font-size="12" fill="#e8f1ff">highlighted</text>
  </g>
</svg>
