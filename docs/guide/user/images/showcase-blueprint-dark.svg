<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 976" data-svgdog="1" font-family="JetBrains Mono, monospace">
  <title>Placing an order</title>
  <desc>How an order goes from the shopper to the warehouse, with payment and stock checked on the way.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#cfe0fa"/></marker>
  </defs>
  <rect x="0" y="0" width="512" height="976" fill="#0f2f5c"/>
  <g id="group-backend">
    <rect x="104" y="232" width="384" height="432" fill="none" stroke="#a9c0e4" stroke-width="1"/>
    <text x="116" y="256.32" font-size="12" fill="#a9c0e4">Backend</text>
  </g>
  <g id="node-shopper" data-step="1">
    <rect x="152" y="24" width="112" height="48" rx="24" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <text x="208" y="52.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Shopper</text>
    <circle cx="159.2" cy="31.2" r="9" fill="#e8f1ff" data-badge="1"/>
    <text x="159.2" y="35.52" text-anchor="middle" font-size="12" fill="#0f2f5c">1</text>
  </g>
  <g id="node-shop" data-step="1">
    <rect x="152" y="120" width="112" height="64" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <line x1="152" y1="136" x2="264" y2="136" stroke="#cfe0fa" stroke-width="1"/>
    <text x="208" y="164.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Web shop</text>
    <circle cx="152" cy="120" r="9" fill="#e8f1ff" data-badge="1"/>
    <text x="152" y="124.32" text-anchor="middle" font-size="12" fill="#0f2f5c">1</text>
  </g>
  <g id="node-api" data-step="2">
    <rect x="152" y="272" width="112" height="48" fill="#e8f1ff" stroke="#cfe0fa" stroke-width="1"/>
    <text x="208" y="300.68" text-anchor="middle" font-size="13" fill="#0f2f5c">Order API</text>
    <circle cx="152" cy="272" r="9" fill="#e8f1ff" data-badge="2"/>
    <text x="152" y="276.32" text-anchor="middle" font-size="12" fill="#0f2f5c">2</text>
  </g>
  <g id="node-pay" data-step="2">
    <rect x="24" y="720" width="176" height="48" fill="#153d75" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="112" y="748.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Payment provider</text>
    <circle cx="24" cy="720" r="9" fill="#e8f1ff" data-badge="2"/>
    <text x="24" y="724.32" text-anchor="middle" font-size="12" fill="#0f2f5c">2</text>
  </g>
  <g id="node-stock" data-step="2">
    <polygon points="208,368 296,400 208,432 120,400" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <text x="208" y="404.68" text-anchor="middle" font-size="13" fill="#e8f1ff">In stock?</text>
    <circle cx="164" cy="384" r="9" fill="#e8f1ff" data-badge="2"/>
    <text x="164" y="388.32" text-anchor="middle" font-size="12" fill="#0f2f5c">2</text>
  </g>
  <g id="node-orders" data-step="3">
    <path d="M160 488 A48 8 0 0 1 256 488 L256 536 A48 8 0 0 1 160 536 Z" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <path d="M160 488 A48 8 0 0 0 256 488" fill="none" stroke="#cfe0fa" stroke-width="1"/>
    <text x="208" y="522.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Orders</text>
    <circle cx="160" cy="480" r="9" fill="#e8f1ff" data-badge="3"/>
    <text x="160" y="484.32" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
  </g>
  <g id="node-events" data-step="3">
    <path d="M136 592 L280 592 A8 24 0 0 1 280 640 L136 640 A8 24 0 0 1 136 592 Z" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <path d="M280 592 A8 24 0 0 0 280 640" fill="none" stroke="#cfe0fa" stroke-width="1"/>
    <text x="208" y="620.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Order events</text>
    <circle cx="135.2" cy="599.2" r="9" fill="#e8f1ff" data-badge="3"/>
    <text x="135.2" y="603.52" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
  </g>
  <g id="node-slip" data-step="3">
    <path d="M232 712 L376 712 L376 768 Q340 756 304 768 Q268 780 232 768 Z" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <text x="304" y="744.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Packing slip</text>
    <circle cx="232" cy="712" r="9" fill="#e8f1ff" data-badge="3"/>
    <text x="232" y="716.32" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
  </g>
  <g id="edge-shopper--shop" data-step="1">
    <path d="M208 72 L208 120" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="223" cy="96" r="9" fill="#e8f1ff" data-badge="1"/>
    <text x="223" y="100.32" text-anchor="middle" font-size="12" fill="#0f2f5c">1</text>
    <text x="276.88" y="100.32" text-anchor="middle" font-size="12" fill="#e8f1ff">checks out</text>
  </g>
  <g id="edge-shop--api">
    <path d="M208 184 L208 272" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="256.77" y="210.32" text-anchor="middle" font-size="12" fill="#e8f1ff">place order</text>
  </g>
  <g id="edge-api--pay" data-step="2">
    <path d="M168 320 L168 360 L112 360 L112 720" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="127" cy="450" r="9" fill="#e8f1ff" data-badge="2"/>
    <text x="127" y="454.32" text-anchor="middle" font-size="12" fill="#0f2f5c">2</text>
    <text x="165.33" y="454.32" text-anchor="middle" font-size="12" fill="#e8f1ff">charge</text>
  </g>
  <g id="edge-api--stock" data-step="2">
    <path d="M208 320 L208 368" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="223" cy="344" r="9" fill="#e8f1ff" data-badge="2"/>
    <text x="223" y="348.32" text-anchor="middle" font-size="12" fill="#0f2f5c">2</text>
    <text x="265.22" y="348.32" text-anchor="middle" font-size="12" fill="#e8f1ff">reserve</text>
  </g>
  <g id="edge-stock--orders" data-step="3">
    <path d="M208 432 L208 480" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <circle cx="223" cy="456" r="9" fill="#e8f1ff" data-badge="3"/>
    <text x="223" y="460.32" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
    <text x="253.55" y="460.32" text-anchor="middle" font-size="12" fill="#e8f1ff">save</text>
  </g>
  <g id="edge-orders--events" data-step="3">
    <path d="M208 544 L208 592" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <circle cx="223" cy="568" r="9" fill="#e8f1ff" data-badge="3"/>
    <text x="223" y="572.32" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
    <text x="265.22" y="572.32" text-anchor="middle" font-size="12" fill="#e8f1ff">publish</text>
  </g>
  <g id="edge-events--slip" data-step="3">
    <path d="M208 640 L208 680 L304 680 L304 712" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
    <circle cx="233.56" cy="694" r="9" fill="#e8f1ff" data-badge="3"/>
    <text x="233.56" y="698.32" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
    <text x="268" y="698.32" text-anchor="middle" font-size="12" fill="#e8f1ff">print</text>
  </g>
  <g id="note-1">
    <line x1="312" y1="616" x2="288" y2="616" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="312" y="592" width="160" height="48" fill="#0f2f5c" stroke="#a9c0e4" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#e8f1ff"><tspan x="392" y="612.32">Delivered at least</tspan><tspan x="392" y="628.32">once</tspan></text>
  </g>
  <g id="legend">
    <line x1="24" y1="818" x2="52" y2="818" stroke="#cfe0fa" stroke-width="1"/>
    <text x="60" y="822.32" font-size="12" fill="#e8f1ff">call</text>
    <line x1="120" y1="818" x2="148" y2="818" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="156" y="822.32" font-size="12" fill="#e8f1ff">asynchronous message</text>
    <line x1="336" y1="818" x2="364" y2="818" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="372" y="822.32" font-size="12" fill="#e8f1ff">dependency</text>
    <rect x="26" y="832" width="24" height="12" rx="2" fill="#e8f1ff" stroke="#cfe0fa" stroke-width="1"/>
    <text x="60" y="842.32" font-size="12" fill="#e8f1ff">highlighted</text>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="869" r="9" fill="#e8f1ff" data-badge="1"/>
      <text x="33" y="873.32" text-anchor="middle" font-size="12" fill="#0f2f5c">1</text>
      <text x="52" y="873.32" font-size="12" fill="#e8f1ff">The shopper checks out in the web shop.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="895" r="9" fill="#e8f1ff" data-badge="2"/>
      <text x="33" y="899.32" text-anchor="middle" font-size="12" fill="#0f2f5c">2</text>
      <text x="52" y="899.32" font-size="12" fill="#e8f1ff">The Order API charges the card and reserves the stock.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="921" r="9" fill="#e8f1ff" data-badge="3"/>
      <text x="33" y="925.32" text-anchor="middle" font-size="12" fill="#0f2f5c">3</text>
      <text x="52" y="925.32" font-size="12" fill="#e8f1ff">The order is saved and announced to the warehouse.</text>
    </g>
  </g>
  <g id="caption">
    <text x="24" y="954.32" font-size="12" fill="#a9c0e4">Payment and stock are checked before the order is saved.</text>
  </g>
</svg>
