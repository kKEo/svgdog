<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 248" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Password reset</title>
  <desc>How a password reset request becomes a new password.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="928" height="248" fill="#ffffff"/>
  <g id="node-user" data-step="1">
    <rect x="24" y="24" width="96" height="48" rx="24" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="72" y="53.09" text-anchor="middle" font-size="14" fill="#1f2937">User</text>
    <circle cx="31.2" cy="31.2" r="9" fill="#2563eb" data-badge="1"/>
    <text x="31.2" y="35.57" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
  </g>
  <g id="node-site">
    <rect x="272" y="16" width="96" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="272" y1="32" x2="368" y2="32" stroke="#1f2937" stroke-width="1.5"/>
    <text x="320" y="61.09" text-anchor="middle" font-size="14" fill="#1f2937">Website</text>
  </g>
  <g id="node-accounts" data-step="2">
    <title>Creates and checks reset tokens.</title>
    <rect x="504" y="24" width="160" height="48" rx="8" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text x="584" y="53.09" text-anchor="middle" font-size="14" fill="#ffffff">Accounts service</text>
    <circle cx="504" cy="24" r="9" fill="#2563eb" data-badge="2"/>
    <text x="504" y="28.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
  </g>
  <a href="https://example.com/mail">
  <g id="node-mail" data-step="3">
    <rect x="776" y="24" width="128" height="48" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="840" y="53.09" text-anchor="middle" font-size="14" fill="#1f2937">Mail provider</text>
    <circle cx="776" cy="24" r="9" fill="#2563eb" data-badge="3"/>
    <text x="776" y="28.37" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
  </g>
  </a>
  <g id="edge-user--site" data-step="1">
    <path d="M120 48 L272 48" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="145.9" cy="34" r="9" fill="#2563eb" data-badge="1"/>
    <text x="145.9" y="38.37" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
    <text x="208" y="38.37" text-anchor="middle" font-size="12" fill="#1f2937">asks for a reset</text>
  </g>
  <g id="edge-site--accounts" data-step="2">
    <path d="M368 48 L504 48" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="394.87" cy="34" r="9" fill="#2563eb" data-badge="2"/>
    <text x="394.87" y="38.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
    <text x="448" y="38.37" text-anchor="middle" font-size="12" fill="#1f2937">create token</text>
  </g>
  <g id="edge-accounts--mail" data-step="3">
    <path d="M664 48 L776 48" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <circle cx="689.66" cy="34" r="9" fill="#2563eb" data-badge="3"/>
    <text x="689.66" y="38.37" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
    <text x="732" y="38.37" text-anchor="middle" font-size="12" fill="#1f2937">send link</text>
  </g>
  <g id="legend">
    <line x1="24" y1="106" x2="52" y2="106" stroke="#1f2937" stroke-width="1.5"/>
    <text x="60" y="110.37" font-size="12" fill="#1f2937">call</text>
    <line x1="112" y1="106" x2="140" y2="106" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="148" y="110.37" font-size="12" fill="#1f2937">asynchronous message</text>
    <rect x="322" y="100" width="24" height="12" rx="2" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text x="356" y="110.37" font-size="12" fill="#1f2937">highlighted</text>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="137" r="9" fill="#2563eb" data-badge="1"/>
      <text x="33" y="141.37" text-anchor="middle" font-size="12" fill="#ffffff">1</text>
      <text x="52" y="141.37" font-size="12" fill="#1f2937">The user asks the website for a password reset.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="163" r="9" fill="#2563eb" data-badge="2"/>
      <text x="33" y="167.37" text-anchor="middle" font-size="12" fill="#ffffff">2</text>
      <text x="52" y="167.37" font-size="12" fill="#1f2937">The accounts service creates a one-time token.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="189" r="9" fill="#2563eb" data-badge="3"/>
      <text x="33" y="193.37" text-anchor="middle" font-size="12" fill="#ffffff">3</text>
      <text x="52" y="193.37" font-size="12" fill="#1f2937">The link is sent by email; the request does not wait for it.</text>
    </g>
  </g>
  <g id="caption">
    <text x="24" y="222.37" font-size="12" fill="#6b7280">The reset link works once and expires after an hour.</text>
  </g>
</svg>
