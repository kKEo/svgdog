<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 208" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Hello pipeline with a cache</title>
  <desc>A web app calls an API, which looks in a cache and queries a database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="512" height="208" fill="#ffffff"/>
  <g id="node-web">
    <rect x="24" y="72" width="96" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="24" y1="88" x2="120" y2="88" stroke="#1f2937" stroke-width="1.5"/>
    <text x="72" y="117.09" text-anchor="middle" font-size="14" fill="#1f2937">Web app</text>
  </g>
  <g id="node-api">
    <rect x="200" y="80" width="96" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="248" y="109.09" text-anchor="middle" font-size="14" fill="#1f2937">API</text>
  </g>
  <g id="node-cache">
    <path d="M384 32 A48 8 0 0 1 480 32 L480 80 A48 8 0 0 1 384 80 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M384 32 A48 8 0 0 0 480 32" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="432" y="67.09" text-anchor="middle" font-size="14" fill="#1f2937">Cache</text>
  </g>
  <g id="node-db">
    <path d="M376 128 A56 8 0 0 1 488 128 L488 176 A56 8 0 0 1 376 176 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M376 128 A56 8 0 0 0 488 128" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="432" y="163.09" text-anchor="middle" font-size="14" fill="#1f2937">Database</text>
  </g>
  <g id="edge-web--api">
    <path d="M120 104 L200 104" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="160" y="96.11" text-anchor="middle" font-size="12" fill="#1f2937">request</text>
  </g>
  <g id="edge-api--cache">
    <path d="M296 96 L344 96 L344 64 L384 64" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="320" y="88.11" text-anchor="middle" font-size="12" fill="#1f2937">lookup</text>
  </g>
  <g id="edge-api--db">
    <path d="M296 112 L336 112 L336 160 L376 160" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="316" y="128.63" text-anchor="middle" font-size="12" fill="#1f2937">query</text>
  </g>
</svg>
