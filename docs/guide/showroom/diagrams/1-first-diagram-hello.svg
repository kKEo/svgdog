<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 80" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Hello pipeline</title>
  <desc>A web app calls an API, which queries a database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="504" height="80" fill="#ffffff"/>
  <g id="node-web">
    <rect x="24" y="8" width="96" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="24" y1="24" x2="120" y2="24" stroke="#1f2937" stroke-width="1.5"/>
    <text x="72" y="53.09" text-anchor="middle" font-size="14" fill="#1f2937">Web app</text>
  </g>
  <g id="node-api">
    <rect x="200" y="16" width="96" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="248" y="45.09" text-anchor="middle" font-size="14" fill="#1f2937">API</text>
  </g>
  <g id="node-db">
    <path d="M368 16 A56 8 0 0 1 480 16 L480 64 A56 8 0 0 1 368 64 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M368 16 A56 8 0 0 0 480 16" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="424" y="51.09" text-anchor="middle" font-size="14" fill="#1f2937">Database</text>
  </g>
  <g id="edge-web--api">
    <path d="M120 40 L200 40" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="160" y="32.11" text-anchor="middle" font-size="12" fill="#1f2937">request</text>
  </g>
  <g id="edge-api--db">
    <path d="M296 40 L368 40" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="332" y="32.11" text-anchor="middle" font-size="12" fill="#1f2937">query</text>
  </g>
</svg>
