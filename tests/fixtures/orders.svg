<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240">
  <title>Order placement</title>
  <desc>How an order moves from the storefront to fulfilment.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="240" fill="#ffffff"/>
  <g id="node-web">
    <rect x="40" y="88" width="144" height="64" rx="6" fill="#dbeafe" stroke="#1f2937"/>
    <text x="112" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1f2937">Storefront</text>
  </g>
  <g id="node-api">
    <rect x="288" y="88" width="144" height="64" rx="6" fill="#2563eb" stroke="#1f2937"/>
    <text x="360" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff">Order API</text>
  </g>
  <g id="node-db">
    <rect x="536" y="88" width="144" height="64" rx="6" fill="#dbeafe" stroke="#1f2937"/>
    <text x="608" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#1f2937">Orders DB</text>
  </g>
  <g id="edge-web--api">
    <line x1="184" y1="120" x2="288" y2="120" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="236" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#1f2937">POST /orders</text>
  </g>
  <g id="edge-api--db">
    <line x1="432" y1="120" x2="536" y2="120" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="484" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#1f2937">insert</text>
  </g>
</svg>
