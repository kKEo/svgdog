version: 1
diagram: flow
title: Order placement
description: How an order moves from the storefront to fulfilment.
direction: right
theme: docs-light

nodes:
  - id: web
    label: Storefront
    kind: client
  - id: api
    label: Order API
    kind: service
    emphasis: true
  - id: db
    label: Orders DB
    kind: datastore
  - id: queue
    label: Fulfilment queue
    kind: queue

groups:
  - id: backend
    label: Backend
    members: [api, db, queue]

edges:
  - from: web
    to: api
    label: POST /orders
  - from: api
    to: db
    label: insert
  - from: api
    to: queue
    label: publish
    style: async

notes:
  - attach: queue
    text: At-least-once delivery
