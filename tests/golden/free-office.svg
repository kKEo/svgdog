<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Office network</title>
  <desc>Where the network equipment sits on the office floor and how it is cabled.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0L0 4L10 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="424" fill="#ffffff"/>
  <g id="group-closet">
    <rect x="248" y="120" width="160" height="280" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="260" y="144.37" font-size="12" fill="#6b7280">Server closet</text>
  </g>
  <g id="node-isp">
    <rect x="24" y="24" width="128" height="48" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="88" y="53.09" text-anchor="middle" font-size="14" fill="#1f2937">Internet line</text>
  </g>
  <g id="node-router">
    <rect x="24" y="160" width="96" height="48" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="72" y="189.09" text-anchor="middle" font-size="14" fill="#1f2937">Router</text>
  </g>
  <g id="node-switch">
    <rect x="264" y="160" width="128" height="48" rx="8" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text x="328" y="189.09" text-anchor="middle" font-size="14" fill="#ffffff">Core switch</text>
  </g>
  <g id="node-ap1">
    <rect x="504" y="64" width="112" height="48" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="560" y="93.09" text-anchor="middle" font-size="14" fill="#1f2937">Wi-Fi east</text>
  </g>
  <g id="node-ap2">
    <rect x="504" y="256" width="112" height="48" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="560" y="285.09" text-anchor="middle" font-size="14" fill="#1f2937">Wi-Fi west</text>
  </g>
  <g id="node-nas">
    <path d="M264 328 A56 8 0 0 1 376 328 L376 376 A56 8 0 0 1 264 376 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M264 328 A56 8 0 0 0 376 328" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="320" y="363.09" text-anchor="middle" font-size="14" fill="#1f2937">File server</text>
  </g>
  <g id="edge-isp--router">
    <path d="M88 72 L88 120 L72 120 L72 160" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="108.05" y="100.37" text-anchor="middle" font-size="12" fill="#1f2937">fibre</text>
  </g>
  <g id="edge-router--switch">
    <path d="M120 184 L264 184" fill="none" stroke="#1f2937" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-switch--ap1">
    <path d="M392 176 L448 176 L448 88 L504 88" fill="none" stroke="#1f2937" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="465.88" y="136.37" text-anchor="middle" font-size="12" fill="#1f2937">PoE</text>
  </g>
  <g id="edge-switch--ap2">
    <path d="M392 192 L448 192 L448 280 L504 280" fill="none" stroke="#1f2937" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
    <text x="465.88" y="240.37" text-anchor="middle" font-size="12" fill="#1f2937">PoE</text>
  </g>
  <g id="edge-switch--nas">
    <path d="M328 208 L328 264 L320 264 L320 320" fill="none" stroke="#1f2937" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  </g>
  <g id="note-1">
    <line x1="176" y1="48" x2="152" y2="48" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="176" y="32" width="80" height="32" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text x="216" y="52.37" text-anchor="middle" font-size="12" fill="#1f2937">1 Gbit/s</text>
  </g>
</svg>
