<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 608" data-svgdog="1" font-family="Inter, sans-serif">
  <title>A SaaS product in four tiers</title>
  <desc>Browsers and the mobile app go through the edge to the services, which keep their data in three stores.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="544" height="608" fill="#ffffff"/>
  <g id="group-edge">
    <rect x="24" y="136" width="496" height="112" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="36" y="160.37" font-size="12" fill="#6b7280">Edge</text>
  </g>
  <g id="group-app">
    <rect x="24" y="296" width="496" height="112" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="36" y="320.37" font-size="12" fill="#6b7280">Application</text>
  </g>
  <g id="group-data">
    <rect x="24" y="456" width="496" height="128" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="36" y="480.37" font-size="12" fill="#6b7280">Data</text>
  </g>
  <g id="node-browser">
    <rect x="144" y="24" width="96" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="144" y1="40" x2="240" y2="40" stroke="#1f2937" stroke-width="1.5"/>
    <text x="192" y="69.09" text-anchor="middle" font-size="14" fill="#1f2937">Browser</text>
  </g>
  <g id="node-mobile">
    <rect x="288" y="24" width="112" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="288" y1="40" x2="400" y2="40" stroke="#1f2937" stroke-width="1.5"/>
    <text x="344" y="69.09" text-anchor="middle" font-size="14" fill="#1f2937">Mobile app</text>
  </g>
  <g id="node-cdn">
    <rect x="128" y="176" width="96" height="48" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="176" y="205.09" text-anchor="middle" font-size="14" fill="#1f2937">CDN</text>
  </g>
  <g id="node-lb">
    <rect x="272" y="176" width="144" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="344" y="205.09" text-anchor="middle" font-size="14" fill="#1f2937">Load balancer</text>
  </g>
  <g id="node-api">
    <rect x="96" y="336" width="96" height="48" rx="8" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text x="144" y="365.09" text-anchor="middle" font-size="14" fill="#ffffff">API</text>
  </g>
  <g id="node-jobs">
    <rect x="288" y="336" width="160" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="368" y="365.09" text-anchor="middle" font-size="14" fill="#1f2937">Background jobs</text>
  </g>
  <g id="node-pg">
    <path d="M40 504 A64 8 0 0 1 168 504 L168 552 A64 8 0 0 1 40 552 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M40 504 A64 8 0 0 0 168 504" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="104" y="539.09" text-anchor="middle" font-size="14" fill="#1f2937">PostgreSQL</text>
  </g>
  <g id="node-redis">
    <path d="M216 504 A48 8 0 0 1 312 504 L312 552 A48 8 0 0 1 216 552 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M216 504 A48 8 0 0 0 312 504" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="264" y="539.09" text-anchor="middle" font-size="14" fill="#1f2937">Redis</text>
  </g>
  <g id="node-files">
    <path d="M360 504 A72 8 0 0 1 504 504 L504 552 A72 8 0 0 1 360 552 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M360 504 A72 8 0 0 0 504 504" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="432" y="539.09" text-anchor="middle" font-size="14" fill="#1f2937">Object storage</text>
  </g>
  <g id="edge-browser--cdn">
    <path d="M192 88 L192 152 L176 152 L176 176" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-browser--lb">
    <path d="M224 88 L224 152 L288 152 L288 176" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-mobile--lb">
    <path d="M344 88 L344 176" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-lb--api">
    <path d="M344 224 L344 280 L144 280 L144 336" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-api--pg">
    <path d="M136 384 L136 440 L112 440 L112 496.18" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-api--redis">
    <path d="M176 384 L176 440 L264 440 L264 496" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-jobs--pg">
    <path d="M304 384 L304 472 L152 472 L152 498.84" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-jobs--files">
    <path d="M432 384 L432 496" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-api--jobs">
    <path d="M192 360 L288 360" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="240" y="352.11" text-anchor="middle" font-size="12" fill="#1f2937">schedule</text>
  </g>
</svg>
