<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 512" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Deployment tiers</title>
  <desc>Layered diagram: CDN to Single-page app; Single-page app to REST API (JSON); REST API to PostgreSQL; REST API to Redis (cache); Job runner to Object storage (upload); REST API to Job runner (enqueue).</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="544" height="512" fill="#ffffff"/>
  <g id="group-presentation">
    <rect x="24" y="24" width="496" height="128" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="36" y="48.37" font-size="12" fill="#6b7280">Presentation</text>
  </g>
  <g id="group-application">
    <rect x="24" y="200" width="496" height="112" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="36" y="224.37" font-size="12" fill="#6b7280">Application</text>
  </g>
  <g id="group-storage">
    <rect x="24" y="360" width="496" height="128" rx="8" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="36" y="384.37" font-size="12" fill="#6b7280">Storage</text>
  </g>
  <g id="node-cdn">
    <rect x="120" y="72" width="96" height="48" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="168" y="101.09" text-anchor="middle" font-size="14" fill="#1f2937">CDN</text>
  </g>
  <g id="node-spa">
    <rect x="264" y="64" width="160" height="64" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="264" y1="80" x2="424" y2="80" stroke="#1f2937" stroke-width="1.5"/>
    <text x="344" y="109.09" text-anchor="middle" font-size="14" fill="#1f2937">Single-page app</text>
  </g>
  <g id="node-api">
    <rect x="112" y="240" width="112" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="168" y="269.09" text-anchor="middle" font-size="14" fill="#1f2937">REST API</text>
  </g>
  <g id="node-jobs">
    <rect x="320" y="240" width="112" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="376" y="269.09" text-anchor="middle" font-size="14" fill="#1f2937">Job runner</text>
  </g>
  <g id="node-pg">
    <path d="M40 408 A64 8 0 0 1 168 408 L168 456 A64 8 0 0 1 40 456 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M40 408 A64 8 0 0 0 168 408" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="104" y="443.09" text-anchor="middle" font-size="14" fill="#1f2937">PostgreSQL</text>
  </g>
  <g id="node-redis">
    <path d="M216 408 A48 8 0 0 1 312 408 L312 456 A48 8 0 0 1 216 456 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M216 408 A48 8 0 0 0 312 408" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="264" y="443.09" text-anchor="middle" font-size="14" fill="#1f2937">Redis</text>
  </g>
  <g id="node-s3">
    <path d="M360 408 A72 8 0 0 1 504 408 L504 456 A72 8 0 0 1 360 456 Z" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M360 408 A72 8 0 0 0 504 408" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="432" y="443.09" text-anchor="middle" font-size="14" fill="#1f2937">Object storage</text>
  </g>
  <g id="edge-cdn--spa">
    <path d="M216 96 L264 96" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-spa--api">
    <path d="M280 128 L280 184 L208 184 L208 240" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="244" y="176.11" text-anchor="middle" font-size="12" fill="#1f2937">JSON</text>
  </g>
  <g id="edge-api--pg">
    <path d="M152 288 L152 344 L128 344 L128 400.61" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-api--redis">
    <path d="M208 288 L208 344 L232 344 L232 402.1" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="256.72" y="377.42" text-anchor="middle" font-size="12" fill="#1f2937">cache</text>
  </g>
  <g id="edge-jobs--s3">
    <path d="M376 288 L376 344 L416 344 L416 400.33" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="442.92" y="376.53" text-anchor="middle" font-size="12" fill="#1f2937">upload</text>
  </g>
  <g id="edge-api--jobs">
    <path d="M224 264 L320 264" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="272" y="256.11" text-anchor="middle" font-size="12" fill="#1f2937">enqueue</text>
  </g>
</svg>
