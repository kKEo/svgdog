<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" data-svgdog="1" font-family="JetBrains Mono, monospace">
  <title>Order placement</title>
  <desc>How an order moves from the storefront to fulfilment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#cfe0fa"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="256" fill="#0f2f5c"/>
  <g id="group-backend">
    <rect x="280" y="24" width="576" height="208" fill="none" stroke="#a9c0e4" stroke-width="1"/>
    <text x="292" y="48.32" font-size="12" fill="#a9c0e4">Backend</text>
  </g>
  <g id="node-web">
    <rect x="24" y="112" width="128" height="64" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <line x1="24" y1="128" x2="152" y2="128" stroke="#cfe0fa" stroke-width="1"/>
    <text x="88" y="156.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Storefront</text>
  </g>
  <g id="node-api">
    <rect x="296" y="120" width="112" height="48" fill="#e8f1ff" stroke="#cfe0fa" stroke-width="1"/>
    <text x="352" y="148.68" text-anchor="middle" font-size="13" fill="#0f2f5c">Order API</text>
  </g>
  <g id="node-db">
    <path d="M616 72 A56 8 0 0 1 728 72 L728 120 A56 8 0 0 1 616 120 Z" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <path d="M616 72 A56 8 0 0 0 728 72" fill="none" stroke="#cfe0fa" stroke-width="1"/>
    <text x="672" y="106.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Orders DB</text>
  </g>
  <g id="node-queue">
    <path d="M504 168 L680 168 A8 24 0 0 1 680 216 L504 216 A8 24 0 0 1 504 168 Z" fill="#153d75" stroke="#cfe0fa" stroke-width="1"/>
    <path d="M680 168 A8 24 0 0 0 680 216" fill="none" stroke="#cfe0fa" stroke-width="1"/>
    <text x="592" y="196.68" text-anchor="middle" font-size="13" fill="#e8f1ff">Fulfilment queue</text>
  </g>
  <g id="edge-web--api">
    <path d="M152 144 L296 144" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="224" y="135.4" text-anchor="middle" font-size="12" fill="#e8f1ff">POST /orders</text>
  </g>
  <g id="edge-api--db">
    <path d="M408 136 L512 136 L512 104 L616 104" fill="none" stroke="#cfe0fa" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="460" y="127.4" text-anchor="middle" font-size="12" fill="#e8f1ff">insert</text>
  </g>
  <g id="edge-api--queue">
    <path d="M408 152 L456 152 L456 192 L496 192" fill="none" stroke="#cfe0fa" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="466" y="209.24" text-anchor="middle" font-size="12" fill="#e8f1ff">publish</text>
  </g>
  <g id="note-1">
    <line x1="712" y1="192" x2="688" y2="192" stroke="#a9c0e4" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="712" y="168" width="128" height="48" fill="#0f2f5c" stroke="#a9c0e4" stroke-width="1"/>
    <text text-anchor="middle" font-size="12" fill="#e8f1ff"><tspan x="776" y="188.32">At-least-once</tspan><tspan x="776" y="204.32">delivery</tspan></text>
  </g>
</svg>
