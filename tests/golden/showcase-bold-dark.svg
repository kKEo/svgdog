<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 1072" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Placing an order</title>
  <desc>How an order goes from the shopper to the warehouse, with payment and stock checked on the way.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#fafafa"/></marker>
  </defs>
  <rect x="0" y="0" width="552" height="1072" fill="#0a0a0a"/>
  <g id="group-backend">
    <rect x="112" y="264" width="416" height="496" rx="10" fill="none" stroke="#a3a3a3" stroke-width="1.5"/>
    <text x="124" y="288.73" font-size="13" fill="#a3a3a3">Backend</text>
  </g>
  <g id="node-shopper" data-step="1">
    <rect x="160" y="24" width="128" height="64" rx="32" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5"/>
    <text x="224" y="61.82" text-anchor="middle" font-size="16" fill="#fafafa">Shopper</text>
    <circle cx="169.6" cy="33.6" r="9" fill="#fb7185" data-badge="1"/>
    <text x="169.6" y="38.33" text-anchor="middle" font-size="13" fill="#0a0a0a">1</text>
  </g>
  <g id="node-shop" data-step="1">
    <rect x="160" y="136" width="128" height="80" rx="10" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5"/>
    <line x1="160" y1="152" x2="288" y2="152" stroke="#fafafa" stroke-width="2.5"/>
    <text x="224" y="189.82" text-anchor="middle" font-size="16" fill="#fafafa">Web shop</text>
    <circle cx="160" cy="136" r="9" fill="#fb7185" data-badge="1"/>
    <text x="160" y="140.73" text-anchor="middle" font-size="13" fill="#0a0a0a">1</text>
  </g>
  <g id="node-api" data-step="2">
    <rect x="168" y="304" width="112" height="64" rx="10" fill="#fb7185" stroke="#fafafa" stroke-width="2.5"/>
    <text x="224" y="341.82" text-anchor="middle" font-size="16" fill="#0a0a0a">Order API</text>
    <circle cx="168" cy="304" r="9" fill="#fb7185" data-badge="2"/>
    <text x="168" y="308.73" text-anchor="middle" font-size="13" fill="#0a0a0a">2</text>
  </g>
  <g id="node-pay" data-step="2">
    <rect x="24" y="808" width="192" height="64" rx="5" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="120" y="845.82" text-anchor="middle" font-size="16" fill="#fafafa">Payment provider</text>
    <circle cx="24" cy="808" r="9" fill="#fb7185" data-badge="2"/>
    <text x="24" y="812.73" text-anchor="middle" font-size="13" fill="#0a0a0a">2</text>
  </g>
  <g id="node-stock" data-step="2">
    <polygon points="224,416 304,456 224,496 144,456" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5"/>
    <text x="224" y="461.82" text-anchor="middle" font-size="16" fill="#fafafa">In stock?</text>
    <circle cx="184" cy="436" r="9" fill="#fb7185" data-badge="2"/>
    <text x="184" y="440.73" text-anchor="middle" font-size="13" fill="#0a0a0a">2</text>
  </g>
  <g id="node-orders" data-step="3">
    <path d="M176 552 A48 8 0 0 1 272 552 L272 616 A48 8 0 0 1 176 616 Z" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5"/>
    <path d="M176 552 A48 8 0 0 0 272 552" fill="none" stroke="#fafafa" stroke-width="2.5"/>
    <text x="224" y="595.82" text-anchor="middle" font-size="16" fill="#fafafa">Orders</text>
    <circle cx="176" cy="544" r="9" fill="#fb7185" data-badge="3"/>
    <text x="176" y="548.73" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
  </g>
  <g id="node-events" data-step="3">
    <path d="M144 672 L304 672 A8 32 0 0 1 304 736 L144 736 A8 32 0 0 1 144 672 Z" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5"/>
    <path d="M304 672 A8 32 0 0 0 304 736" fill="none" stroke="#fafafa" stroke-width="2.5"/>
    <text x="224" y="709.82" text-anchor="middle" font-size="16" fill="#fafafa">Order events</text>
    <circle cx="145.6" cy="681.6" r="9" fill="#fb7185" data-badge="3"/>
    <text x="145.6" y="686.33" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
  </g>
  <g id="node-slip" data-step="3">
    <path d="M256 808 L400 808 L400 864 Q364 852 328 864 Q292 876 256 864 Z" fill="#1e1b4b" stroke="#fafafa" stroke-width="2.5"/>
    <text x="328" y="841.82" text-anchor="middle" font-size="16" fill="#fafafa">Packing slip</text>
    <circle cx="256" cy="808" r="9" fill="#fb7185" data-badge="3"/>
    <text x="256" y="812.73" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
  </g>
  <g id="edge-shopper--shop" data-step="1">
    <path d="M224 88 L224 136" fill="none" stroke="#fafafa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="239" cy="112" r="9" fill="#fb7185" data-badge="1"/>
    <text x="239" y="116.73" text-anchor="middle" font-size="13" fill="#0a0a0a">1</text>
    <text x="290.45" y="116.73" text-anchor="middle" font-size="13" fill="#fafafa">checks out</text>
  </g>
  <g id="edge-shop--api">
    <path d="M224 216 L224 304" fill="none" stroke="#fafafa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="267.79" y="242.73" text-anchor="middle" font-size="13" fill="#fafafa">place order</text>
  </g>
  <g id="edge-api--pay" data-step="2">
    <path d="M184 368 L184 408 L120 408 L120 808" fill="none" stroke="#fafafa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="135" cy="508" r="9" fill="#fb7185" data-badge="2"/>
    <text x="135" y="512.73" text-anchor="middle" font-size="13" fill="#0a0a0a">2</text>
    <text x="173.03" y="512.73" text-anchor="middle" font-size="13" fill="#fafafa">charge</text>
  </g>
  <g id="edge-api--stock" data-step="2">
    <path d="M224 368 L224 416" fill="none" stroke="#fafafa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="239" cy="392" r="9" fill="#fb7185" data-badge="2"/>
    <text x="239" y="396.73" text-anchor="middle" font-size="13" fill="#0a0a0a">2</text>
    <text x="279.07" y="396.73" text-anchor="middle" font-size="13" fill="#fafafa">reserve</text>
  </g>
  <g id="edge-stock--orders" data-step="3">
    <path d="M224 496 L224 544" fill="none" stroke="#fafafa" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="239" cy="520" r="9" fill="#fb7185" data-badge="3"/>
    <text x="239" y="524.73" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
    <text x="269.45" y="524.73" text-anchor="middle" font-size="13" fill="#fafafa">save</text>
  </g>
  <g id="edge-orders--events" data-step="3">
    <path d="M224 624 L224 672" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <circle cx="239" cy="648" r="9" fill="#fb7185" data-badge="3"/>
    <text x="239" y="652.73" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
    <text x="278" y="652.73" text-anchor="middle" font-size="13" fill="#fafafa">publish</text>
  </g>
  <g id="edge-events--slip" data-step="3">
    <path d="M224 736 L224 776 L328 776 L328 808" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
    <circle cx="257.85" cy="790" r="9" fill="#fb7185" data-badge="3"/>
    <text x="257.85" y="794.73" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
    <text x="288" y="794.73" text-anchor="middle" font-size="13" fill="#fafafa">print</text>
  </g>
  <g id="note-1">
    <line x1="336" y1="704" x2="312" y2="704" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="2 3"/>
    <rect x="336" y="688" width="176" height="32" rx="5" fill="#171717" stroke="#a3a3a3" stroke-width="1.5"/>
    <text x="424" y="708.73" text-anchor="middle" font-size="13" fill="#fafafa">Delivered at least once</text>
  </g>
  <g id="legend">
    <line x1="24" y1="914" x2="52" y2="914" stroke="#fafafa" stroke-width="2.5"/>
    <text x="60" y="918.73" font-size="13" fill="#fafafa">call</text>
    <line x1="112" y1="914" x2="140" y2="914" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="148" y="918.73" font-size="13" fill="#fafafa">asynchronous message</text>
    <line x1="328" y1="914" x2="356" y2="914" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="2 4"/>
    <text x="364" y="918.73" font-size="13" fill="#fafafa">dependency</text>
    <rect x="26" y="928" width="24" height="12" rx="2" fill="#fb7185" stroke="#fafafa" stroke-width="2.5"/>
    <text x="60" y="938.73" font-size="13" fill="#fafafa">highlighted</text>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="965" r="9" fill="#fb7185" data-badge="1"/>
      <text x="33" y="969.73" text-anchor="middle" font-size="13" fill="#0a0a0a">1</text>
      <text x="52" y="969.73" font-size="13" fill="#fafafa">The shopper checks out in the web shop.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="991" r="9" fill="#fb7185" data-badge="2"/>
      <text x="33" y="995.73" text-anchor="middle" font-size="13" fill="#0a0a0a">2</text>
      <text x="52" y="995.73" font-size="13" fill="#fafafa">The Order API charges the card and reserves the stock.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="1017" r="9" fill="#fb7185" data-badge="3"/>
      <text x="33" y="1021.73" text-anchor="middle" font-size="13" fill="#0a0a0a">3</text>
      <text x="52" y="1021.73" font-size="13" fill="#fafafa">The order is saved and announced to the warehouse.</text>
    </g>
  </g>
  <g id="caption">
    <text x="24" y="1051.23" font-size="13" fill="#a3a3a3">Payment and stock are checked before the order is saved.</text>
  </g>
</svg>
