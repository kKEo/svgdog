# Layers: each group is a horizontal band, stacked top to bottom.
version: 1
diagram: layers
title: Application tiers
description: Clients call the gateway, which calls the orders service and its database.
nodes:
  - { id: web, label: Web app, kind: client }
  - { id: mobile, label: Mobile app, kind: client }
  - { id: gateway, label: API gateway, kind: service }
  - { id: orders, label: Orders, kind: service }
  - { id: store, label: Database, kind: datastore }
groups:
  - { id: clients, label: Clients, members: [web, mobile] }
  - { id: services, label: Services, members: [gateway, orders] }
  - { id: data, label: Data, members: [store] }
edges:
  - "web -> gateway"
  - "mobile -> gateway"
  - "gateway -> orders"
  - "orders -> store"
