name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    # R8: the golden-file test passing on all three systems is the proof that
    # render, validate, inspect and preview give the same bytes everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # R15: the timing budgets are strict only in release builds.
      - name: Timing budgets
        run: cargo test --locked --release r15
      # The guide's own diagrams are written in its pages; they must be current.
      - name: Guide diagrams are up to date
        run: cargo run --locked --release --quiet -- docs docs/guide README.md --check --format text
