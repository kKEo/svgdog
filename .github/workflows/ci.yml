name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # R8: the golden-file test passing on all three systems is the proof that
    # render, validate, inspect and preview give the same bytes everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # R15: the timing budgets are strict only in release builds.
      - run: cargo test --release r15
