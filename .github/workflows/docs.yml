name: docs

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.4.40"
  MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook (pinned, checksum verified)
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o mdbook.tar.gz
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C /usr/local/bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: ./docs/check.sh
      - name: Build books
        run: |
          mkdir -p site
          for b in user operator tester showroom; do mdbook build docs/guide/$b; done
          cp docs/guide/index.html docs/guide/tldr.html site/
          if [ -d docs/guide/assets ]; then cp -r docs/guide/assets site/assets; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
