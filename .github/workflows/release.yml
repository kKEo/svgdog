name: release

# Push a tag such as v1.0.0 to publish a GitHub release with binaries.
# Run it by hand (workflow_dispatch) to build the same binaries without publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    name: version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)."
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries are linked statically, so they run on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="svgdog-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "../target/${{ matrix.target }}/release/svgdog.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "../target/${{ matrix.target }}/release/svgdog" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: svgdog-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [check, version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum svgdog-* > SHA256SUMS
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # A tag with a suffix (v1.1.0-rc.1) is published as a pre-release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "svgdog ${{ needs.version.outputs.version }}" \
            --generate-notes --verify-tag "${flags[@]}"
