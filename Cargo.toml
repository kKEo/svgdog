[package]
name = "svgdoc"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
kurbo = "0.13.1"
roxmltree = "0.21.2"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
simplecss = "0.2.2"
svgtypes = "0.16.2"
toml = "1.2.1"

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
