[package]
name = "svgdog"
version = "1.0.4"
edition = "2024"
rust-version = "1.85"
description = "Compile declarative diagram descriptions to SVG and check any SVG for correctness, legibility and portability"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kKEo/svgdog"
homepage = "https://github.com/kKEo/svgdog"
documentation = "https://kkeo.github.io/svgdog/"
readme = "README.md"
keywords = ["svg", "diagram", "lint", "cli", "mcp"]
categories = ["command-line-utilities", "visualization", "development-tools"]
include = [
    "/src/**",
    "/fonts/**",
    "/schemas/**",
    "/examples/**",
    "/themes/**",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

# Prebuilt binaries from the GitHub release, used by `cargo binstall svgdog`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/svgdog-{ version }-{ target }.tar.gz"
bin-dir = "svgdog-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
kurbo = "0.13.1"
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"] }
roxmltree = "0.21.2"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
simplecss = "0.2.2"
svgtypes = "0.16.2"
toml = "1.2.1"
yaml-rust2 = "0.13.0"

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
